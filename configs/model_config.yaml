# How models are trained, tuned, compared and promoted.
training:
  cv_folds: 5              # stratified k-fold cross-validation on the TRAIN set only
  n_iter: 15               # random hyperparameter combinations tried per model
  tuning_metric: roc_auc   # how candidates are ranked during tuning
  random_state: 42

# Decision threshold: the model outputs P(malignant). Above the threshold -> "malignant".
# We pick the threshold on out-of-fold TRAIN predictions so recall >= target_recall.
threshold:
  target_recall: 0.98

# Quality gate: a new model must pass these on the held-out test set to become "champion".
promotion:
  min_recall: 0.95
  min_roc_auc: 0.97

mlflow:
  experiment_name: cancer-classification
  registered_model_name: cancer-classifier
  champion_alias: champion

# Where the exported champion bundle is written (the API loads it from here).
export:
  model_dir: artifacts/model

# Hyperparameter search spaces (sampled by RandomizedSearchCV).
search_spaces:
  logistic_regression:
    clf__C: [0.001, 0.01, 0.1, 0.3, 1.0, 3.0, 10.0, 30.0, 100.0]
  gradient_boosting:
    clf__n_estimators: [100, 200, 300]
    clf__learning_rate: [0.01, 0.05, 0.1, 0.2]
    clf__max_depth: [2, 3, 4]
    clf__subsample: [0.7, 0.85, 1.0]
    clf__min_samples_leaf: [1, 3, 5]
  neural_network:
    clf__hidden_layer_sizes: [[16], [32], [64], [32, 16], [64, 32]]
    clf__alpha: [0.0001, 0.001, 0.01, 0.1, 1.0]
    clf__learning_rate_init: [0.001, 0.003, 0.01]
