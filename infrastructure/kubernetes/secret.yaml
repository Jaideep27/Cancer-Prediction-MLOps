# Sensitive settings. The API requires header "X-API-Key: <this value>" on /predict.
#
# HONEST NOTE: a Secret is only base64-ENCODED, not encrypted, and committing it to git
# (as here, for a local demo) is NOT acceptable in production. Real setups create it
# out-of-band (kubectl create secret ...) or use Sealed Secrets / External Secrets
# backed by a vault (AWS Secrets Manager, HashiCorp Vault).
apiVersion: v1
kind: Secret
metadata:
  name: cancer-api-secret
  labels:
    app.kubernetes.io/name: cancer-api
type: Opaque
stringData:          # plain text here; Kubernetes stores it base64-encoded
  API_KEY: "local-demo-key"
