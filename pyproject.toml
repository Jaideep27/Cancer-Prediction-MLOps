[project]
name = "cancer-mlops"
version = "1.0.0"
description = "Breast cancer prediction with a production-style MLOps stack"
requires-python = ">=3.11"

[tool.black]
line-length = 100
extend-exclude = "venv"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true   # sklearn, mlflow, scipy ship no/partial type hints
warn_unused_ignores = true
exclude = ["venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    # Starlette nags about its test client's HTTP library; harmless for our tests.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/models/train.py"]  # the full training run is exercised by the train workflow, not unit tests
