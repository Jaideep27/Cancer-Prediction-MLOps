# `kubectl apply -k infrastructure/kubernetes` applies all of these, in the cancer-mlops namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cancer-mlops
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
