# Where the data lives and how to split it.
data:
  raw_path: data/raw/data.csv
  target_column: diagnosis
  id_column: id
  positive_label: M        # malignant = the class we must not miss (encoded as 1)
  negative_label: B        # benign (encoded as 0)
  test_size: 0.2           # 20% held out, never touched during training/tuning
  random_state: 42         # same split every run, so runs are comparable
