# Scheduled retraining: every Monday 06:00 UTC (and on demand).
# The run fails (and GitHub emails you) if the new model does not pass the quality gate.
#
# HONEST NOTE: the dataset in this repo is static, so retraining reproduces the same
# model. In a real system this job would first pull NEW labelled data (e.g. from a
# warehouse), and would usually be triggered by the drift alert, not only the clock.
name: Scheduled model training

on:
  schedule:
    - cron: "0 6 * * 1"      # minute hour day-of-month month day-of-week (UTC)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - run: pip install -r requirements.txt -c requirements.lock.txt

      - name: Train, evaluate, quality gate
        run: python -m scripts.train
        env:
          GIT_SHA: ${{ github.sha }}
          # Point at a shared MLflow server to keep history across runs, e.g.
          # MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          # Without it, runs go to a throwaway SQLite file uploaded below.

      - name: Upload model, metrics and MLflow history
        if: always()               # upload even when the gate fails, to inspect why
        uses: actions/upload-artifact@v4
        with:
          name: training-run-${{ github.run_number }}
          path: |
            artifacts/
            mlflow.db
          retention-days: 30
