# CD = Continuous Delivery: pushing a version tag (git tag v1.2.0 && git push --tags)
# builds the image, pushes it to GitHub Container Registry, then deploys it --
# but only after a human approves the "production" environment in GitHub.
# Approval step = continuous DELIVERY. Remove it = continuous DEPLOYMENT.
name: CD

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}     # "Run workflow" button for manual releases

permissions:
  contents: read
  packages: write           # allow pushing to ghcr.io with the built-in GITHUB_TOKEN

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - run: pip install -r requirements.txt -c requirements.lock.txt

      - name: Train + quality gate (fails the release if the model is not good enough)
        run: python -m scripts.train
        env:
          GIT_SHA: ${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.ref_name }}
          path: |
            artifacts/model/metadata.json
            artifacts/metrics/latest_run.json

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # provided automatically, no setup needed

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cancer-api
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha            # reuse layers from previous runs
          cache-to: type=gha,mode=max

      - id: image
        name: Pick the immutable sha tag for deployment
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${owner}/cancer-api:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Configure "production" in GitHub -> Settings -> Environments with required reviewers.
    environment: production
    env:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
    steps:
      # HONEST NOTE: this needs a real, internet-reachable cluster. The local kind
      # cluster is not reachable from GitHub, so without the secret this job skips.
      - name: Check a cluster is configured
        id: check
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "No KUBECONFIG_B64 secret: skipping deploy."; echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.enabled == 'true'
        uses: azure/setup-kubectl@v4
      - if: steps.check.outputs.enabled == 'true'
        name: Rolling update
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > kubeconfig; export KUBECONFIG=$PWD/kubeconfig
          kubectl -n cancer-mlops set image deployment/cancer-api api=${{ needs.build-and-push.outputs.image }}
          if ! kubectl -n cancer-mlops rollout status deployment/cancer-api --timeout=300s; then
            echo "Rollout failed: rolling back to the previous version"
            kubectl -n cancer-mlops rollout undo deployment/cancer-api
            exit 1
          fi
